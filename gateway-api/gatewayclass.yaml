# Este GatewayClass é criado automaticamente pelo Helm chart do NGINX Gateway
# Fabric (values.yaml: nginxGateway.gatewayClassName=nginx e
# nginxGateway.gatewayControllerName=gateway.nginx.org/nginx-gateway-controller).
#
# Arquivo mantido aqui só como referência/documentação do que já existe no
# cluster depois do `helm install`. NÃO faça `kubectl apply -f` neste arquivo:
# o objeto real tem um campo parametersRef apontando para o NginxProxy gerado
# pelo Helm, e reaplicar esta versão simplificada sobrescreveria essa
# referência.
#
# Para inspecionar o objeto real criado pelo Helm:
#   kubectl get gatewayclass nginx -o yaml
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: nginx
spec:
  controllerName: gateway.nginx.org/nginx-gateway-controller
