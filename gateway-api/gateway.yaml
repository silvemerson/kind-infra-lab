# Gateway que expõe um listener HTTP na porta 80.
#
# O NGINX Gateway Fabric provisiona automaticamente um Deployment + Service
# para este Gateway (no mesmo namespace dele). Por padrão esse Service já é
# do tipo LoadBalancer, então ele recebe IP direto do pool do MetalLB
# configurado em loadbalancer/metallb-config.yaml (kind-pool,
# 172.20.0.240-172.20.0.250).
#
# allowedRoutes.namespaces.from: All — por padrão um listener só aceita
# HTTPRoute do mesmo namespace do Gateway ("Same"). Como o cicd-lab/ sobe
# Gitea/Jenkins/cicd-demo cada um no seu próprio namespace, liberamos aqui
# pra qualquer namespace poder anexar HTTPRoute neste Gateway — sem isso,
# cada app novo precisaria ficar dentro do namespace `default` junto com o
# Gateway, o que não faz sentido.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: nginx-gateway
  namespace: default
spec:
  gatewayClassName: nginx
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
