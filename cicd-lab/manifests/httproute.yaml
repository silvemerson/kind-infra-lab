apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: demo-app
  namespace: cicd-demo
spec:
  parentRefs:
    - name: nginx-gateway
      namespace: default
      sectionName: http
  hostnames:
    - "demo-app.gateway.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: demo-app
          port: 80
